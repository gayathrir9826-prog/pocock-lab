<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Monthly totals by city</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header>
    <h1>Monthly totals by city</h1>
    <nav><a href="./index.html">Home</a><a href="./monthly.html" aria-current="page">Monthly totals</a></nav>
  </header>
  <main>
    <p id="status" aria-live="polite">Loading data&hellip;</p>
    <section id="monthly" hidden>
      <svg id="monthly-chart" class="line-chart" role="img"
           aria-label="Line chart of Monthly totals for each city by month"></svg>
      <table id="monthly-table">
        <thead><tr><th>City</th></tr></thead>
        <tbody></tbody>
      </table>
    </section>
  </main>
  <script type="module">
    import { parseCsv } from "./src/csv.js";
    import { monthlyTotals, lineChartLayout, CHART_SIZE } from "./src/monthly.js";

    const status = document.getElementById("status");
    let rows;
    try {
      const response = await fetch("./data/rides.csv");
      if (!response.ok) throw new Error(response.statusText);
      rows = parseCsv(await response.text());
    } catch {
      status.textContent = "Could not load ride data";
    }

    if (rows && rows.length === 0) {
      status.textContent = "No ride data";
    } else if (rows) {
      const monthly = monthlyTotals(rows);
      const { months, series } = monthly;
      status.hidden = true;

      const chart = document.getElementById("monthly-chart");
      chart.setAttribute("viewBox", `0 0 ${CHART_SIZE.width} ${CHART_SIZE.height}`);
      const { plot, yTicks, xTicks, series: lines } = lineChartLayout(monthly, CHART_SIZE);
      const svg = (name, attrs, text) => {
        const el = document.createElementNS("http://www.w3.org/2000/svg", name);
        for (const [key, value] of Object.entries(attrs)) el.setAttribute(key, value);
        if (text !== undefined) el.textContent = text;
        return el;
      };
      for (const { value, y } of yTicks) {
        chart.append(
          svg("line", { class: "grid", x1: plot.left, x2: plot.right, y1: y, y2: y }),
          svg("text", { class: "y-tick", x: plot.left - 8, y }, value.toLocaleString("en-US")),
        );
      }
      for (const { label, x } of xTicks) {
        chart.append(svg("text", { class: "x-tick", x, y: plot.bottom + 22 }, label));
      }
      const middleY = (plot.top + plot.bottom) / 2;
      chart.append(svg("text", { class: "axis-title", transform: `translate(14 ${middleY}) rotate(-90)` }, "Rides"));
      for (const { points, segments } of lines) {
        for (const segment of segments) {
          chart.append(svg("polyline", { class: "line", points: segment.map((p) => `${p.x},${p.y}`).join(" ") }));
        }
        for (const { x, y, label } of points) {
          const marker = svg("circle", { class: "marker", cx: x, cy: y, r: 4 });
          marker.append(svg("title", {}, label));
          chart.append(marker);
        }
      }

      const headRow = document.querySelector("#monthly-table thead tr");
      for (const { label } of months) {
        const th = document.createElement("th");
        th.textContent = label;
        headRow.appendChild(th);
      }

      const tbody = document.querySelector("#monthly-table tbody");
      for (const { city, totals } of series) {
        const tr = document.createElement("tr");
        const th = document.createElement("th");
        th.scope = "row";
        th.textContent = city;
        tr.appendChild(th);
        for (const total of totals) {
          const td = document.createElement("td");
          td.textContent = total === null ? "" : total.toLocaleString("en-US");
          tr.appendChild(td);
        }
        tbody.appendChild(tr);
      }
      document.getElementById("monthly").hidden = false;
    }
  </script>
</body>
</html>
